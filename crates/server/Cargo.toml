[package]
name = "hongsi-server"
description = "웹 중계 API + 열람실 좌석 감시 + PostgreSQL 저장소"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hongsi-config.workspace = true
hongsi-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
chrono.workspace = true
tracing.workspace = true
futures.workspace = true
axum = { version = "=0.8.9", features = ["multipart"] }
tower-http = { version = "=0.6.11", features = ["fs", "trace"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "json", "macros", "migrate"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
rand = "=0.8.5"
hmac = "=0.12.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
aes-gcm = "=0.10.3"

web-push = { version = "=0.11.0", default-features = false }
jsonwebtoken = "=9.3.1"
base64 = "=0.22.1"
dotenvy = "=0.15.7"
