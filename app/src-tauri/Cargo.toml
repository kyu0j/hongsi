[package]
name = "hongsi-app"
description = "홍시 · 홍대생의 시간을 효율적으로"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hongsi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
hongsi-config.workspace = true
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
hongsi-config.workspace = true
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-notifications = { version = "=0.4.6", features = ["push-notifications"] }
hongsi-direct = { path = "../../crates/direct" }
hongsi-student-card = { path = "../../crates/student-card" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
base64 = "=0.22.1"
zeroize = "=1.9.0"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
sha2 = "=0.10.9"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-hongsi-ios = { path = "plugins/ios" }
