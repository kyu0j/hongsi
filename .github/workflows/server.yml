name: Ubuntu server
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
permissions:
  contents: read
jobs:
  build:
    env:
      HONGSI_API_URL: ${{ secrets.HONGSI_API_URL }}
      HONGSI_REPO_URL: ${{ secrets.HONGSI_REPO_URL }}
      HONGSI_SUPPORT_URL: ${{ secrets.HONGSI_SUPPORT_URL }}
      HONGSI_DEMO_URL: ${{ secrets.HONGSI_DEMO_URL }}
      HONGSI_SCHOOL_URL: ${{ secrets.HONGSI_SCHOOL_URL }}
      HONGSI_SSO_URL: ${{ secrets.HONGSI_SSO_URL }}
      HONGSI_PORTAL_URL: ${{ secrets.HONGSI_PORTAL_URL }}
      HONGSI_CLASSROOM_URL: ${{ secrets.HONGSI_CLASSROOM_URL }}
      HONGSI_ATTENDANCE_URL: ${{ secrets.HONGSI_ATTENDANCE_URL }}
      HONGSI_CLASSNET_URL: ${{ secrets.HONGSI_CLASSNET_URL }}
      HONGSI_FOOD_URL: ${{ secrets.HONGSI_FOOD_URL }}
      HONGSI_SEAT_G_URL: ${{ secrets.HONGSI_SEAT_G_URL }}
      HONGSI_SEAT_T_URL: ${{ secrets.HONGSI_SEAT_T_URL }}
      HONGSI_SEAT_R_URL: ${{ secrets.HONGSI_SEAT_R_URL }}
      HONGSI_STUDENT_CARD_URL: ${{ secrets.HONGSI_STUDENT_CARD_URL }}
      HONGSI_FCM_URL: ${{ secrets.HONGSI_FCM_URL }}
      HONGSI_FCM_TOKEN_URL: ${{ secrets.HONGSI_FCM_TOKEN_URL }}
      HONGSI_FCM_SCOPE: ${{ secrets.HONGSI_FCM_SCOPE }}
      HONGSI_APNS_URL: ${{ secrets.HONGSI_APNS_URL }}
      HONGSI_APNS_SANDBOX_URL: ${{ secrets.HONGSI_APNS_SANDBOX_URL }}
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate build configuration
        run: node app/scripts/public-env.mjs --check-build
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release version from tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease && 'true' || 'false' }}
        run: node app/scripts/set-release-version.mjs "$RELEASE_TAG"
      - name: Build web and Linux server
        run: |
          test "$(uname -m)" = aarch64
          pnpm --dir app install --frozen-lockfile
          pnpm --dir app build
          cargo build --locked --release -p hongsi-server
          mkdir -p "$RUNNER_TEMP/hongsi-server/bin"
          cp target/release/hongsi-server "$RUNNER_TEMP/hongsi-server/bin/"
          cp -R app/dist "$RUNNER_TEMP/hongsi-server/"
          cp .env.example LICENSE "$RUNNER_TEMP/hongsi-server/"
          tar -czf "$RUNNER_TEMP/hongsi-server-ubuntu26-arm64.tar.gz" -C "$RUNNER_TEMP/hongsi-server" .
      - uses: actions/upload-artifact@v7
        with:
          name: hongsi-server-ubuntu26-arm64
          path: ${{ runner.temp }}/hongsi-server-ubuntu26-arm64.tar.gz

  publish:
    if: github.event_name == 'release' && !github.event.release.draft
    needs: build
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hongsi-server-ubuntu26-arm64
          path: release-assets
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Upload server bundle
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_PATH=$(node -e 'process.stdout.write(encodeURIComponent(process.env.RELEASE_TAG))')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_PATH" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$RELEASE_TAG" --argjson pre "$RELEASE_PRERELEASE" '.tag_name == $tag and .draft == false and .prerelease == $pre and .published_at != null' "$RUNNER_TEMP/release.json"
          gh release upload --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" release-assets/hongsi-server-ubuntu26-arm64.tar.gz

  deploy:
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    needs: publish
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    concurrency:
      group: hongsi-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hongsi-server-ubuntu26-arm64
          path: release-assets
      - name: Check latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          if jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$RUNNER_TEMP/latest-release.json" > /dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload and restart Hongsi
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.HONGSI_DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.HONGSI_DEPLOY_SSH_KEY }}
        run: |
          : "${DEPLOY_HOST:?}" "${DEPLOY_SSH_KEY:?}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/hongsi_key
          chmod 600 ~/.ssh/hongsi_key
          trap 'rm -f ~/.ssh/hongsi_key' EXIT
          ssh_options=(-i "$HOME/.ssh/hongsi_key" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          scp "${ssh_options[@]}" release-assets/hongsi-server-ubuntu26-arm64.tar.gz "ubuntu@$DEPLOY_HOST:/home/ubuntu/hongsi/.deploy.tar.gz"
          ssh "${ssh_options[@]}" "ubuntu@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          cd /home/ubuntu/hongsi
          tar -tzf .deploy.tar.gz > /dev/null
          rm -rf -- bin dist LICENSE
          tar -xzf .deploy.tar.gz ./bin ./dist ./LICENSE
          rm -f .deploy.tar.gz
          sudo -n systemctl restart hongsi.service
          REMOTE
