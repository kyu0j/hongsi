name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Build App Store IPA
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HONGSI_API_URL: ${{ secrets.HONGSI_API_URL }}
      HONGSI_REPO_URL: ${{ secrets.HONGSI_REPO_URL }}
      HONGSI_SUPPORT_URL: ${{ secrets.HONGSI_SUPPORT_URL }}
      HONGSI_DEMO_URL: ${{ secrets.HONGSI_DEMO_URL }}
      HONGSI_SCHOOL_URL: ${{ secrets.HONGSI_SCHOOL_URL }}
      HONGSI_SSO_URL: ${{ secrets.HONGSI_SSO_URL }}
      HONGSI_PORTAL_URL: ${{ secrets.HONGSI_PORTAL_URL }}
      HONGSI_CLASSROOM_URL: ${{ secrets.HONGSI_CLASSROOM_URL }}
      HONGSI_ATTENDANCE_URL: ${{ secrets.HONGSI_ATTENDANCE_URL }}
      HONGSI_CLASSNET_URL: ${{ secrets.HONGSI_CLASSNET_URL }}
      HONGSI_FOOD_URL: ${{ secrets.HONGSI_FOOD_URL }}
      HONGSI_SEAT_G_URL: ${{ secrets.HONGSI_SEAT_G_URL }}
      HONGSI_SEAT_T_URL: ${{ secrets.HONGSI_SEAT_T_URL }}
      HONGSI_SEAT_R_URL: ${{ secrets.HONGSI_SEAT_R_URL }}
      HONGSI_STUDENT_CARD_URL: ${{ secrets.HONGSI_STUDENT_CARD_URL }}
      HONGSI_FCM_URL: ${{ secrets.HONGSI_FCM_URL }}
      HONGSI_FCM_TOKEN_URL: ${{ secrets.HONGSI_FCM_TOKEN_URL }}
      HONGSI_FCM_SCOPE: ${{ secrets.HONGSI_FCM_SCOPE }}
      HONGSI_APNS_URL: ${{ secrets.HONGSI_APNS_URL }}
      HONGSI_APNS_SANDBOX_URL: ${{ secrets.HONGSI_APNS_SANDBOX_URL }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease && 'true' || 'false' }}
      BUILD_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate build configuration
        run: node scripts/public-env.mjs --check-build
      - name: Prepare App Store signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: node scripts/ios-release.mjs prepare-signing
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Prepare XcodeGen
        run: |
          if ! command -v xcodegen > /dev/null; then brew install xcodegen; fi
          xcodebuild -version
          xcodegen --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-appstore-arm64
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Set release version
        run: node scripts/set-release-version.mjs "$BUILD_VERSION"
      - run: pnpm build
      - name: Archive and export App Store IPA
        run: node scripts/ios-release.mjs build
      - uses: actions/upload-artifact@v7
        with:
          name: hongsi-ios
          path: ${{ runner.temp }}/hongsi-ios-release/*.ipa
          if-no-files-found: error
      - name: Remove signing files
        if: always()
        run: node scripts/ios-release.mjs cleanup

  publish:
    if: github.event_name == 'release' && !github.event.release.draft
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HONGSI_REPO_URL: ${{ secrets.HONGSI_REPO_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: hongsi-ios
          path: release-assets
      - name: Upload iOS release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease && 'true' || 'false' }}
        run: node app/scripts/ios-release.mjs publish release-assets
