[workspace]
resolver = "2"
members = ["crates/config", "crates/core", "crates/direct", "crates/server", "crates/ios-widget", "crates/student-card", "app/src-tauri", "app/src-tauri/plugins/ios"]

[workspace.package]
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[workspace.dependencies]
hongsi-config = { path = "crates/config" }
hongsi-core = { path = "crates/core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "cookies", "json", "gzip", "charset", "http2", "multipart", "stream"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
futures = "=0.3.34"

[profile.dev]
debug = false
